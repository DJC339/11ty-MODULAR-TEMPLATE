<div class="container header-row">
  <a class="brand" href="/">{{ site.title }}</a>
  <button type="button" id="menu-toggle" aria-controls="primary-links" aria-expanded="false" hidden>Menu</button>
  <nav aria-label="Main navigation" id="primary-links">
    <ul>{% for item in navigation %}<li><a href="{{ item.url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>{% endfor %}</ul>
  </nav>
</div>
