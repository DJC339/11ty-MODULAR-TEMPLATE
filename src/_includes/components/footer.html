<div class="container">
  <p>&copy; {{ site.year }} {{ site.title }}</p>
  <nav aria-label="Footer navigation"><ul>{% for item in navigation %}<li><a href="{{ item.url }}">{{ item.title }}</a></li>{% endfor %}</ul></nav>
  {% if site.email %}<p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>{% endif %}
  {% if site.telephone %}<p><a href="tel:{{ site.telephone }}">{{ site.telephone }}</a></p>{% endif %}
</div>
