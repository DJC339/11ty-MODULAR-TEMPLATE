<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}{% if title %} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ description or site.description }}">
{% if not site.indexable or noindex or placeholder or draft %}<meta name="robots" content="noindex">{% endif %}
<link rel="stylesheet" href="{{ 'css' | asset }}">
<link rel="icon" href="/assets/public/favicon.svg" type="image/svg+xml">
<script src="{{ 'js' | asset }}" defer></script>
{% if site.url and not noindex and not placeholder and not draft %}<link rel="canonical" href="{{ page.url | absoluteUrl(site.url) }}">{% endif %}
<meta property="og:type" content="{{ 'article' if article else 'website' }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ title or site.title }}">
<meta property="og:description" content="{{ description or site.description }}">
{% if site.url %}<meta property="og:url" content="{{ page.url | absoluteUrl(site.url) }}">{% endif %}
<meta name="twitter:card" content="{{ 'summary_large_image' if site.image else 'summary' }}">
<meta name="twitter:title" content="{{ title or site.title }}">
<meta name="twitter:description" content="{{ description or site.description }}">
{% if site.image and site.url %}
<meta property="og:image" content="{{ site.image | absoluteUrl(site.url) }}">
<meta property="og:image:alt" content="{{ site.imageAlt }}">
<meta name="twitter:image" content="{{ site.image | absoluteUrl(site.url) }}">
<meta name="twitter:image:alt" content="{{ site.imageAlt }}">
{% endif %}
{% if site.business and site.url %}<script type="application/ld+json">{{ site.business | jsonForHtml | safe }}</script>{% endif %}
