[build]
  command = "npm run build"
  publish = "_site"
[build.environment]
  NODE_VERSION = "24"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
# Forced rule prevents serving the form-registration artifact, including deploy permalinks.
[[redirects]]
  from = "/__forms.html"
  to = "/404.html"
  status = 404
  force = true
# Security/caching/indexing headers are generated in _site/_headers by Eleventy.
# Function responses set their own headers. Never add a blanket SPA fallback.
